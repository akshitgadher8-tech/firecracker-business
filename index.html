<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Firecracker Business</title>
<style>
:root{
  --bg:#f5f7fa;--surface:#fff;--text:#172033;--muted:#7a8290;--navy:#13213b;
  --border:#e3e7ed;--green:#15805a;--greenbg:#ecfdf5;--blue:#2563eb;--bluebg:#eff6ff;
  --red:#c6283b;--redbg:#fff1f2;--yellow:#a76700;--yellowbg:#fff7e6;
  --shadow:0 6px 20px rgba(23,32,51,.055);--radius:18px;
}
body.dark{
  --bg:#0f141d;--surface:#171d28;--text:#eef2f7;--muted:#9ca6b5;--navy:#243b64;
  --border:#2a3444;--green:#54c99a;--greenbg:#143328;--blue:#78a9ff;--bluebg:#162943;
  --red:#ff7180;--redbg:#351a20;--yellow:#f2bd5c;--yellowbg:#332816;
  --shadow:0 8px 24px rgba(0,0,0,.22);
}
body.dark .header,body.dark .bottom-nav,body.dark input,body.dark select,body.dark textarea,body.dark .secondary,body.dark .quick button,body.dark .mode,body.dark .back{background:var(--surface);color:var(--text)}
body.dark .nav-btn{background:var(--surface);color:#cbd5e1}
body.dark .nav-btn.active{color:#ffffff}
body.dark .nav-btn b{color:inherit}
body.dark label.field{color:#cbd5e1}
body.dark .product-card .meta,body.dark .bill-meta,body.dark .small,body.dark .muted{color:#aeb8c8}
body.dark .nav-btn .nav-emoji{filter:none;opacity:1}
body.dark .more-tool-btn{background:var(--surface);color:var(--text)}
body.dark .more-tool-btn .tool-icon{background:#222c3b;color:#fff}
body.dark .quick-action-btn,body.dark .quick-action{background:var(--surface);color:var(--text)}
body.dark .stat.metric-green,body.dark .metric-green{background:var(--greenbg)}
body.dark .stat.metric-blue,body.dark .metric-blue{background:var(--bluebg)}
body.dark .stat.metric-red,body.dark .metric-red{background:var(--redbg)}
body.dark .stat.metric-yellow,body.dark .metric-yellow{background:var(--yellowbg)}
body.dark .product-card,body.dark .bill-item,body.dark .transaction,body.dark .customer-card,body.dark .staff-card,body.dark .closing-card,body.dark .stat{background:var(--surface)}
body.dark .login{background:linear-gradient(180deg,#0f141d,#171d28)}
*{box-sizing:border-box}
/* User-selectable UI font sizing. Layout remains compact while text scales consistently. */
body{--fs:1}
body.font-small{--fs:0.90}
body.font-normal{--fs:1}
body.font-large{--fs:1.10}
body.font-small .app,body.font-large .app{font-size:calc(16px * var(--fs))}
body.font-small .app .panel h3,body.font-large .app .panel h3{font-size:calc(16px * var(--fs))}
body.font-small .app .page-title h2,body.font-large .app .page-title h2{font-size:calc(21px * var(--fs))}
body.font-small .app .brand h1,body.font-large .app .brand h1{font-size:calc(17px * var(--fs))}
body.font-small .app input,body.font-small .app select,body.font-small .app textarea,body.font-small .app button,body.font-large .app input,body.font-large .app select,body.font-large .app textarea,body.font-large .app button{font-size:calc(13px * var(--fs))}
body.font-small .app .summary-row,body.font-large .app .summary-row{font-size:calc(13px * var(--fs))}
body.font-small .app .bill-head strong,body.font-large .app .bill-head strong{font-size:calc(13px * var(--fs))}
body.font-small .app .bill-head .amount,body.font-large .app .bill-head .amount{font-size:calc(15px * var(--fs))}
body.font-small .app .stat strong,body.font-large .app .stat strong{font-size:calc(20px * var(--fs))}
body.font-small .app .nav-btn,body.font-large .app .nav-btn{font-size:calc(10px * var(--fs))}
body.font-small .app .nav-btn span,body.font-large .app .nav-btn span{font-size:calc(21px * var(--fs))}
body.font-small .app .small,body.font-large .app .small{font-size:calc(11px * var(--fs))}
body.font-small .app .muted,body.font-large .app .muted{font-size:calc(13px * var(--fs))}
body.font-small .app .stat label,body.font-large .app .stat label{font-size:calc(11px * var(--fs))}
body.font-small .app .stat small,body.font-large .app .stat small{font-size:calc(10px * var(--fs))}
body.font-small .app .status-pill,body.font-large .app .status-pill{font-size:calc(10px * var(--fs))}
body.font-small .app .product-card .name,body.font-large .app .product-card .name{font-size:calc(14px * var(--fs))}
body.font-small .app .product-card .meta,body.font-large .app .product-card .meta{font-size:calc(11px * var(--fs))}
body.font-small .app .more-tool-btn .tool-label,body.font-large .app .more-tool-btn .tool-label{font-size:calc(10px * var(--fs))}

/* Extra compact Billing / Stock styling for small mobile screens. */
main:has(.billing-page-marker){padding:9px 11px}
main:has(.billing-page-marker) .panel{padding:11px;margin-bottom:8px;border-radius:14px}
main:has(.billing-page-marker) .page-title{margin:0 0 8px}
main:has(.billing-page-marker) .panel h3{margin-bottom:7px}
main:has(.billing-page-marker) input,main:has(.billing-page-marker) select{padding:8px 9px;min-height:34px;border-radius:9px;margin-bottom:6px}
main:has(.billing-page-marker) .qty-row{grid-template-columns:36px 1fr 36px;gap:5px}
main:has(.billing-page-marker) .qty-row button{height:34px;font-size:16px}
main:has(.billing-page-marker) .payment-modes{gap:6px;margin:6px 0}
main:has(.billing-page-marker) .mode{padding:8px}
main:has(.billing-page-marker) .payment-inputs{gap:6px}
main:has(.billing-page-marker) .summary-row{padding:5px 0}
main:has(.stock-page-marker){padding:9px 11px}
main:has(.stock-page-marker) .panel{padding:11px;margin-bottom:8px;border-radius:14px}
main:has(.stock-page-marker) .stat{padding:9px;border-radius:12px}
main:has(.stock-page-marker) .grid3{gap:6px}
main:has(.stock-page-marker) input,main:has(.stock-page-marker) select{padding:8px 9px;min-height:34px;border-radius:9px}
main:has(.stock-page-marker) .product-card{padding:10px;border-radius:13px}
main:has(.stock-page-marker) .product-actions{margin-top:6px}
main:has(.stock-page-marker) .product-actions button{min-height:32px;padding:6px 8px}

html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,Manrope,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:74px}
.header{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;position:sticky;top:0;z-index:20}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;flex:none}
.brand h1{font-size:17px;line-height:1.15;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.header-meta{text-align:right;flex:none}
.header-meta strong{display:block;font-size:12px}
.header-meta small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.logout{width:38px;height:38px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text);font-size:18px}
main{padding:14px 16px}
.page-title{display:flex;align-items:center;gap:10px;margin:3px 0 13px}
.page-title h2{font-size:21px;line-height:1.15;margin:0;font-weight:800}
.back{border:1px solid var(--border);background:#fff;border-radius:12px;width:38px;height:38px;font-size:20px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
.panel h3{font-size:16px;margin:0 0 11px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px;box-shadow:var(--shadow);min-width:0}
.stat label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.stat strong{font-size:20px;line-height:1.05}
.stat small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.metric-green{background:var(--greenbg)}.metric-blue{background:var(--bluebg)}.metric-red{background:var(--redbg)}.metric-yellow{background:var(--yellowbg)}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text);padding:11px 12px;outline:none;margin:0 0 9px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#91a4c4;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
label.field{display:block;font-size:11px;font-weight:700;margin:0 0 5px;color:#566071}
.primary,.secondary,.danger-btn,.ghost{border-radius:12px;padding:11px 13px;font-weight:750;border:1px solid transparent;min-height:42px}
.primary{background:var(--navy);color:#fff}
.secondary{background:#fff;color:var(--text);border-color:var(--border)}
.danger-btn{background:var(--redbg);color:var(--red);border-color:#fecdd3}
.ghost{background:transparent;color:var(--muted);border-color:transparent}
.full{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row>*{flex:1}
.search{position:relative}.search input{padding-left:37px}
.search span{position:absolute;left:12px;top:10px;color:var(--muted);font-size:15px}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.row + .row{margin-top:9px}
.divider{height:1px;background:var(--border);margin:10px 0}
.small{font-size:11px;color:var(--muted)}.muted{color:var(--muted)}
.good{color:var(--green)}.info{color:var(--blue)}.bad{color:var(--red)}.warn{color:var(--yellow)}
.alert{padding:10px 11px;border-radius:12px;font-size:12px;margin-top:8px}
.alert.good{background:var(--greenbg)}.alert.bad{background:var(--redbg)}.alert.warn{background:var(--yellowbg)}.alert.info{background:var(--bluebg)}
.flash{position:sticky;top:63px;z-index:18;margin:-4px 0 10px;padding:10px 12px;border-radius:12px;font-size:12px;font-weight:700}
.flash.good{background:var(--greenbg);color:var(--green)}.flash.bad{background:var(--redbg);color:var(--red)}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);height:66px;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{border:0;background:#fff;color:#8b929e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:650}
.nav-btn span{font-size:21px;line-height:1}.nav-icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.nav-btn.active{color:var(--navy);font-weight:800}
.hero{background:#fff;border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .date{font-size:11px;color:var(--muted)}.hero .title{font-size:20px;font-weight:800;margin-top:3px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 5px;box-shadow:var(--shadow);font-size:11px;font-weight:750;color:var(--text)}
.quick i{font-style:normal;display:block;font-size:20px;margin-bottom:5px}
.bill-item,.transaction,.customer-card,.staff-card,.product-card,.closing-card{border:1px solid var(--border);border-radius:15px;padding:12px;background:#fff}
.bill-item + .bill-item,.transaction + .transaction,.customer-card + .customer-card,.staff-card + .staff-card,.product-card + .product-card,.closing-card + .closing-card{margin-top:8px}
.bill-item{cursor:pointer}.bill-item:hover,.transaction:hover,.staff-card:hover{border-color:#c9d3e4}
.bill-head{display:flex;justify-content:space-between;gap:8px}.bill-head strong{font-size:13px}.bill-head .amount{font-size:15px;font-weight:800}
.bill-meta{font-size:11px;color:var(--muted);margin-top:3px}.status-pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800;margin-top:7px}
.status-paid{background:var(--greenbg);color:var(--green)}.status-partial{background:var(--yellowbg);color:var(--yellow)}.status-unpaid{background:var(--redbg);color:var(--red)}
.stock-indicator{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:800;line-height:1;border:1px solid transparent;white-space:nowrap}.stock-indicator .dot{width:7px;height:7px;border-radius:50%;display:inline-block}.stock-in{background:var(--greenbg);color:var(--green);border-color:color-mix(in srgb,var(--green) 22%,transparent)}.stock-in .dot{background:var(--green)}.stock-low{background:var(--yellowbg);color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 22%,transparent)}.stock-low .dot{background:var(--yellow)}.stock-critical{background:var(--redbg);color:var(--red);border-color:color-mix(in srgb,var(--red) 22%,transparent)}.stock-critical .dot{background:var(--red)}.stock-out{background:var(--redbg);color:var(--red);border-color:color-mix(in srgb,var(--red) 28%,transparent)}.stock-out .dot{background:var(--red)}
.selected-product{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px;margin:2px 0 6px}.permission-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.permission-item{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:11px;padding:9px;background:var(--surface);font-size:11px;font-weight:700}.permission-item input{width:auto;margin:0;min-height:auto}.permission-note{font-size:10px;color:var(--muted);margin-top:5px}
.product-card .name{font-weight:800;font-size:14px}.product-card .meta{font-size:11px;color:var(--muted);line-height:1.55;margin-top:3px}
.product-actions{display:flex;gap:6px;margin-top:9px}.product-actions button{flex:1}
.qty-row{display:grid;grid-template-columns:42px 1fr 42px;gap:1px;align-items:center}
.qty-row button{height:42px;border:1px solid var(--border);background:#f8fafc;border-radius:11px;font-size:20px;font-weight:800}.qty-row input{text-align:center;margin:0}
.payment-modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.mode{border:1px solid var(--border);border-radius:13px;padding:11px;background:#fff}
.mode.active.cash{border-color:#7ac9aa;background:var(--greenbg)}.mode.active.online{border-color:#93b4ff;background:var(--bluebg)}
.mode strong{display:block;font-size:12px}.mode small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}.summary-row:last-child{border-bottom:0}
.summary-row.total{font-size:17px;font-weight:850}
.payment-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timeline{position:relative}.timeline-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}.timeline-item:last-child{border-bottom:0}.dot{width:9px;height:9px;border-radius:50%;background:#667eea;margin-top:5px;flex:none}.timeline-item strong{font-size:12px}.timeline-item small{display:block;color:var(--muted);font-size:10px;margin-top:2px;line-height:1.45}
.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(180deg,#f4f7fb,#fff)}
.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:0 16px 40px rgba(23,32,51,.08)}
.login-logo{width:58px;height:58px;border-radius:17px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:850;margin-bottom:15px}
.login-card h1{font-size:23px;margin:0 0 4px}.login-card p{color:var(--muted);font-size:12px;margin:0 0 18px}
.cc-hero{background:var(--navy);color:#fff;border-radius:18px;padding:17px;margin-bottom:12px}.cc-hero small{opacity:.75;font-size:10px}.cc-hero strong{display:block;font-size:27px;margin:3px 0}.cc-hero span{font-size:11px;opacity:.8}
.command-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.recon{background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:12px;color:var(--text)}
body.dark .recon{background:var(--surface);border-color:var(--border);color:var(--text)}
body.dark .recon .summary-row{color:var(--text)}
body.dark .recon .summary-row span{color:var(--muted)}
body.dark .recon .summary-row strong{color:var(--text)}
.recon .diff{font-size:21px;font-weight:850}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tabs button{white-space:nowrap;border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:750}.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:700}
@media(max-width:430px){main{padding:12px}.quick{grid-template-columns:repeat(4,1fr)}.stat strong{font-size:19px}.brand h1{font-size:16px}}
@media(min-width:761px){body{background:#e9edf3}.app{background:var(--bg);box-shadow:0 0 30px rgba(23,32,51,.08)}}
@media print{
  body{background:#fff}.header,.bottom-nav,main>*:not(#printArea){display:none!important}.app{padding:0;max-width:none}.header+main{padding:0}#printArea{display:block!important}
}

/* Full-colour bottom navigation */
.bottom-nav{
  background:#fff;
  border-top:1px solid #e4e7ee;
  box-shadow:0 -4px 18px rgba(16,29,53,.07);
}
.bottom-nav button{
  opacity:1 !important;
  transition:transform .12s ease,color .12s ease;
}
.bottom-nav button:nth-child(1){color:#e08a3e !important}
.bottom-nav button:nth-child(2){color:#4d8bd8 !important}
.bottom-nav button:nth-child(3){color:#b47a3c !important}
.bottom-nav button:nth-child(4){color:#2f8fba !important}
.bottom-nav button:nth-child(5){color:#7b67b8 !important}
.bottom-nav button.active,
.bottom-nav button.active *{
  color:#14233f !important;
  font-weight:800 !important;
}
.bottom-nav button .nav-icon,
.bottom-nav button svg{opacity:1 !important;filter:none !important}
.bottom-nav button:active{transform:scale(.96)}


/* Compact billing layout */
main:has(.billing-page-marker) .page-title{margin:1px 0 6px}
main:has(.billing-page-marker) .page-title h2{font-size:18px}
main:has(.billing-page-marker) .back{width:34px;height:34px;font-size:18px}
main:has(.billing-page-marker) .panel{padding:10px;margin-bottom:7px;border-radius:13px}
main:has(.billing-page-marker) .panel h3{font-size:14px;margin-bottom:7px}
main:has(.billing-page-marker) input,
main:has(.billing-page-marker) textarea,
main:has(.billing-page-marker) select{padding:7px 9px;border-radius:9px;margin-bottom:5px;font-size:12px;min-height:36px}
main:has(.billing-page-marker) label.field{font-size:9px;margin-bottom:3px}
main:has(.billing-page-marker) .qty-row{grid-template-columns:36px 1fr 36px;gap:5px}
main:has(.billing-page-marker) .qty-row button{height:36px;border-radius:9px;font-size:17px}
main:has(.billing-page-marker) .qty-row input{min-height:36px}
main:has(.billing-page-marker) .primary,
main:has(.billing-page-marker) .secondary,
main:has(.billing-page-marker) .danger-btn{min-height:36px;padding:7px 9px;border-radius:9px;font-size:11px}
main:has(.billing-page-marker) .bill-item{padding:9px;border-radius:12px}
main:has(.billing-page-marker) .summary-row{padding:6px 0;font-size:11px}
main:has(.billing-page-marker) .summary-row.total{font-size:14px}
main:has(.billing-page-marker) .payment-modes{gap:5px;margin:4px 0}
main:has(.billing-page-marker) .mode{padding:7px;border-radius:9px}
main:has(.billing-page-marker) .mode strong{font-size:10px}
main:has(.billing-page-marker) .mode small{font-size:8px}
main:has(.billing-page-marker) .payment-inputs{gap:5px}
main:has(.billing-page-marker) .small{font-size:9px}

/* Compact Stock layout */
main:has(.stock-page-marker) .page-title h2{font-size:18px}
main:has(.stock-page-marker) .panel{padding:10px;margin-bottom:7px;border-radius:13px}
main:has(.stock-page-marker) .panel h3{font-size:14px;margin-bottom:7px}
main:has(.stock-page-marker) input,
main:has(.stock-page-marker) select{padding:7px 9px;border-radius:9px;margin-bottom:5px;font-size:12px;min-height:36px}
main:has(.stock-page-marker) .primary,
main:has(.stock-page-marker) .secondary,
main:has(.stock-page-marker) .danger-btn{min-height:34px;padding:6px 9px;border-radius:9px;font-size:11px}
main:has(.stock-page-marker) .small{font-size:9px}

<script>

/* ------------------------- Storage / migration ------------------------- */

const DEFAULT_PERMISSIONS={
  billing:true,sales:true,customers:true,payments:true,
  stock:false,finance:false,expenses:false,
  dayClosing:false,reports:false,settings:false,draftBills:false,maxDiscount:false

  products:"fb_products",sales:"fb_sales",customers:"fb_customers",expenses:"fb_expenses",

  session:"fb_session",closings:"fb_day_closings",transactions:"fb_transactions",
  activity:"fb_activity_log",ownerCashWithdrawals:"fb_owner_cash_withdrawals",ownerItemWithdrawals:"fb_owner_item_withdrawals",stockLedger:"fb_stock_ledger",stockTransfers:"fb_stock_transfers",billDrafts:"fb_bill_drafts",version:"fb_app_version"
};
const $=id=>document.getElementById(id);
const IS_NATIVE_APP=!!(window.Capacitor && typeof window.Capacitor.isNativePlatform==="function" && window.Capacitor.isNativePlatform());
const IS_HTTP_RUNTIME=/^https?:$/i.test(location.protocol);
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const money=v=>"₹"+Math.round(num(v)).toLocaleString("en-IN");
const esc=v=>{const d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML};
const now=()=>new Date();
const isoDate=d=>{const x=d instanceof Date?d:new Date(d);return isNaN(x)?todayISO():x.toISOString().slice(0,10)};

function read(key,fallback){
  try{const x=JSON.parse(localStorage.getItem(key));return x==null?fallback:x}catch(e){return fallback}
}
function write(key,val){localStorage.setItem(key,JSON.stringify(val))}

/* ------------------------- Shared SHTTP JSON database ------------------------- */
/*
  When the app is opened from SHTTP, all devices use the same JSON file:
  shared_data.json in the same server folder as this HTML.
  SHTTP must have "Allow file modification" / WebDAV enabled.
*/
const SHARED_DB_FILE="shared_data.json";
let sharedDbReady=false,sharedSyncing=false,sharedSyncQueued=false,sharedBooting=true,sharedSuppressSave=false,sharedLastError="";

  return new URL((activeBusinessId?"shared_data_"+activeBusinessId+".json":SHARED_DB_FILE),location.href).href;
}

      sharedSuppressSave=true;

let sharedWritePromise=null;
async function pushSharedData(){
  if(!/^https?:$/i.test(location.protocol))return false;

  // Serialize writes. A bill must wait for any background save already running
  // instead of being reported as failed just because sharedSyncing was true.
  if(sharedWritePromise){
    try{await sharedWritePromise}catch(e){}
    if(!sharedSyncing)return pushSharedData();
  }

  sharedSyncing=true;
  sharedWritePromise=(async()=>{
    try{
      const snapshot=sharedSnapshot();
      // Keep the previous known-good server copy before replacing shared data.
      // Backup failure never blocks the main save, because the live data file is authoritative.
      if(activeBusinessId){try{await pushJsonFile(SHARED_BACKUP_PREFIX+activeBusinessId+".json",{...snapshot,backupAt:new Date().toISOString(),businessId:activeBusinessId})}catch(e){}}
      const payload=JSON.stringify(snapshot,null,2);
      const r=await fetch(sharedDbUrl(),{
        method:"PUT",
        headers:{"Content-Type":"application/json;charset=UTF-8"},
        body:payload,
        credentials:"same-origin",
        cache:"no-store"
      });
      if(!r.ok)throw new Error("HTTP "+r.status);
      sharedDbReady=true;
      sharedLastError="";
      return true;
    }catch(e){
      console.warn("Shared database write failed:",e);
      sharedLastError=String(e?.message||e);
      return false;
    }finally{
      sharedSyncing=false;
    }
  })();

  const result=await sharedWritePromise;
  sharedWritePromise=null;
  if(!result){
    flashMsg("Saved on this device. SHTTP could not write shared_data.json. Enable file modification + WebDAV in SHTTP.","bad");
  }
  return result;
}

async function bootSharedDatabase(){
  sharedBooting=true;
  if(staticHostingFallback){
    sharedBooting=false;
    return;
  }
  const loaded=await pullSharedData();
  if(!loaded && /^https?:$/i.test(location.protocol)){
    normalizeSharedData();
    if(sharedLastError==="404"){
      // The file does not exist yet: initialize it once from the Owner device.
      const created=await pushSharedData();
      sharedDbReady=created;
      if(!created)console.warn("shared_data.json was not found and SHTTP did not allow creating it.");
    }else{
      sharedDbReady=false;
      console.warn("Cannot read shared_data.json. Check that it is valid JSON.");
    }
  }else{
    normalizeSharedData();
    sharedDbReady=!!loaded;
  }
  sharedBooting=false;
}

function rebuildTransactions(){
  const map=new Map();

  (sales||[]).forEach(s=>{
    const history=Array.isArray(s.paymentHistory)?s.paymentHistory:[];

    // The original/new-bill transaction records ONLY the payment made when
    // the bill was created. Later outstanding collections are separate
    // transactions so the same money is never counted twice.
    const initial=history.find(p=>(p.type||"")==="Bill Payment");
    const initialCash=num(initial?.cashAmount??0);
    const initialOnline=num(initial?.onlineAmount??0);
    const initialAmount=num(initial?.amount??(initialCash+initialOnline));

    if(initialAmount>0){
      const base={
        id:"bill-"+s.id,
        type:"New Bill Payment",
        date:initial?.isoDate?initial.isoDate.slice(0,10):(initial?.dateISO||initial?.date||s.isoDate||todayISO()),
        time:initial?.time||s.time||"",
        at:initial?.isoDate||s.createdAt||"",
        invoiceId:s.id,
        invoiceNo:s.invoiceNo,
        customer:s.customer,
        amount:initialAmount,
        cash:initialCash,
        online:initialOnline,
        by:initial?.by||s.staffName||"Owner",
        byAccountId:initial?.byAccountId||s.staffId||"owner",
        comment:initial?.comment||("New bill payment · Cash "+money(initialCash)+" · Online "+money(initialOnline))
      };
      map.set(base.id,base);
    }

    // Every outstanding collection is its own transaction and remains
    // attached to the same invoice/bill.
    history.forEach((p,i)=>{
      if((p.type||"")!=="Outstanding Payment") return;

      const stamp=p.isoDate||p.dateISO||"";
      const key="pay-"+(p.id||s.id+"-"+i);
      const cash=num(p.cashAmount??(String(p.method||"").toLowerCase().includes("cash")?p.amount:0));
      const online=num(p.onlineAmount??(String(p.method||"").toLowerCase().includes("online")?p.amount:0));
      const amount=num(p.amount??(cash+online));

      map.set(key,{
        id:key,
        type:"Outstanding Payment",
        date:stamp?stamp.slice(0,10):(p.date||todayISO()),
        time:p.time||"",
        at:stamp,
        invoiceId:s.id,
        invoiceNo:s.invoiceNo,
        customer:s.customer,
        amount,
        cash,
        online,
        by:p.by||"Owner",
        byAccountId:p.byAccountId||s.staffId||"owner",
        comment:p.comment||("Outstanding payment · "+money(amount)+" · Remaining "+money(p.remaining))
      });
    });
  });

  (expenses||[]).forEach(e=>{
    map.set("exp-"+e.id,{
      id:"exp-"+e.id,
      type:"Expense",
      date:e.isoDate||todayISO(),
      time:e.time||"",
      at:e.createdAt||"",
      amount:num(e.amount),
      cash:num(e.mode==="Cash"?e.amount:0),
      online:num(e.mode==="Online"?e.amount:0),
      by:e.by||"Owner",
      byAccountId:e.byAccountId||"owner",
      comment:e.note||e.category||"Expense"
    });
  });

  transactions=Array.from(map.values()).sort((a,b)=>
    String(b.at||b.date+" "+b.time).localeCompare(String(a.at||a.date+" "+a.time))
  );
}

function todayOutstandingCollected(){
  return todayTransactions().filter(t=>t.type==="Outstanding Payment").reduce((a,t)=>a+num(t.amount),0)
}
function todaySalesAmount(){return todaySales().reduce((a,s)=>a+num(s.total),0)}
function todayProfit(){return todaySales().reduce((a,s)=>a+num(s.profit),0)}
function todayExpenses(){return expenses.filter(e=>(e.isoDate||todayISO())===todayISO()).reduce((a,e)=>a+num(e.amount),0)}
function lastClosing(){return closings.slice().sort((a,b)=>String(b.closedAt).localeCompare(String(a.closedAt)))[0]||null}
function calculatedOpeningCash(){
  const last=lastClosing();
  const base=num(last?.actualCash);
  if(!last)return base;
  const cutoff=String(last.closedAt||"");
  const withdrawals=(ownerCashWithdrawals||[]).filter(x=>String(x.mode||"").toLowerCase()==="cash" && String(x.isoDate||"") && String(x.isoDate||"")>=String(last.date||"") && String(x.closedAt||x.createdAt||x.isoDate+"T"+(x.time||"00:00:00"))>cutoff);
  return Math.max(0,base-withdrawals.reduce((a,x)=>a+num(x.amount),0));
}

async function adminSupportCheck(id){
  if(!requireAdmin())return;
  try{await pullBusinessRegistry()}catch(e){}
  const b=businessById(id),d=read("fb_business_data_"+id,null);
  if(!b){flashMsg("Business not found.","bad");return}
  const checks=[
    ["Business registry",!!b],
    ["Business data snapshot",!!d],
    ["Accounts",Array.isArray(d?.accounts)],
    ["Products",Array.isArray(d?.products)],
    ["Sales",Array.isArray(d?.sales)],
    ["Draft bills",Array.isArray(d?.billDrafts)]
  ];
  const ok=checks.every(x=>x[1]);
  logAdminAction("support_check",`Checked ${b.name}: ${ok?"healthy":"issues found"}`);
  const result=$("supportResult");

/* ------------------------- License access gate ------------------------- */
function showSubscriptionRequired(b,reason="expired"){
  const name=b?.name||"your business";
  const title=reason==="suspended"?"License Suspended":reason==="removed"?"Subscription Removed":"Subscription Required";
  const msg=reason==="suspended"?"Your business license has been suspended by the administrator. Please contact the administrator to reactivate it.":reason==="removed"?"Your subscription has been removed by the administrator. Please take a subscription to continue using Firecracker Business.":"Your subscription has expired. Please buy or renew a subscription to continue using Firecracker Business.";
  setRoot(`<div class="login"><div class="login-card"><div class="login-logo">F</div><h1>${esc(title)}</h1><p>${esc(name)}</p><div class="alert bad" style="display:block;margin-top:12px">${esc(msg)}</div><div class="panel" style="margin-top:12px;text-align:center"><strong>Access is locked</strong><div class="small" style="margin-top:5px">Home, Billing, Stock, Sales and other business features are unavailable until the license is active.</div></div><button type="button" class="primary full" style="margin-top:10px" onclick="renderLogin()">Back to Login</button></div></div>`);
}
function currentBusinessLicense(b){
  if(!b)return {status:"unknown"};
  return licenseStatusInfo(b);
}
function enforceLicenseAccess(b){
  const l=currentBusinessLicense(b);
  if(l.status==="suspended"){showSubscriptionRequired(b,"suspended");return false}
  if(l.status==="removed"){showSubscriptionRequired(b,"removed");return false}
  if(l.status==="expired"){showSubscriptionRequired(b,"expired");return false}
  return true;
}

/* ------------------------- Login ------------------------- */
async function verifyBusinessServerState(b){
  if(!b||!/^https?:$/i.test(location.protocol))return true;
  let registry=null;
  try{
    const r=await fetch(new URL("business_registry.json",location.href).href+"?t="+Date.now(),{cache:"no-store",credentials:"same-origin"});
    if(!r.ok){
      if((r.status===404||r.status===405)&&businessRegistry.length){
        staticHostingFallback=true;
        const cached=businessById(b.id);
        if(!cached)return false;
        const cachedLicense=licenseStatusInfo(cached);
        if(cached.status!=="active"||["suspended","removed","expired"].includes(cachedLicense.status)){
          showSubscriptionRequired(cached,cachedLicense.status);return false;
        }
        return true;
      }
      return false;
    }
    registry=await r.json();
  }catch(e){return false}
  if(!Array.isArray(registry))return false;
  const remote=registry.find(x=>String(x?.id)===String(b.id));
  if(!remote)return false;
  staticHostingFallback=false;
  businessRegistry=registry;
  write(BUSINESS_REGISTRY_STORE,businessRegistry);
  const l=licenseStatusInfo(remote);
  if(remote.status!=="active"||["suspended","removed","expired"].includes(l.status)){showSubscriptionRequired(remote,l.status);return false}
  return true;
}
async function verifyCurrentBusinessSession(){
  if(!session||isAdmin()||!session.businessId)return true;
  const b=businessById(session.businessId);
  if(!b)return false;
  const ok=await verifyBusinessServerState(b);
  if(!ok)return false;
  const remote=businessById(session.businessId);
  const a=accountById(session.id);
  if(!a||a.enabled===false)return false;
  return !!remote;
}
async function securityHeartbeat(){
  if(!session)return;
  try{
    if(isAdmin()){
      if(session.lockToken){const locks=await fetchAccountLocks();const x=locks[String(session.id)];if(x&&x.token&&x.token!==session.lockToken){adminLogout();return}}
      return;
    }
    const ok=await verifyCurrentBusinessSession();
    if(!ok){await logout();return}
    await renewAccountLock();
  }catch(e){
    // A temporary network error does not immediately log out a live user; the next heartbeat retries.
  }
}
function renderLogin(){
  setRoot(`<div class="login"><div class="login-card"><div class="login-logo">F</div><h1>Firecracker Business</h1><p>Secure account access</p><label class="field">Username</label><input id="loginUser" autocomplete="username" placeholder="Username"><label class="field">PIN / Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="PIN / Password"><button id="loginBtn" type="button" class="primary full">Login</button><button type="button" class="ghost full" style="margin-top:4px;font-size:11px" onclick="testSharedConnection()">Test Shared Data Connection</button><div id="loginMsg" class="alert bad" style="display:none"></div><div class="small" style="text-align:center;margin-top:10px">Use the username and PIN / password provided for your account.</div></div></div>`);
  // Android WebView can reject inline onclick handlers under some WebView/CSP configurations.
  // Bind Login directly after rendering so the button always invokes the authentication flow.
  const btn=$("loginBtn");
  if(btn){
    btn.addEventListener("click",function(e){
      e.preventDefault();
      Promise.resolve(login()).catch(function(err){
        console.error("Login failed:",err);
        const m=$("loginMsg");
        if(m){m.textContent="Login error: "+(err?.message||"Please try again.");m.className="alert bad";m.style.display="block";}
      });
    });
  }
}

async function testSharedConnection(){
  if(!/^https?:$/i.test(location.protocol)){
    $("loginMsg").textContent="Shared Data Connection is only tested when the app is opened through SHTTP (http://...).";
    $("loginMsg").className="alert warn";
    $("loginMsg").style.display="block";
    return;
  }
  $("loginMsg").textContent="Testing "+sharedDbUrl()+" …";
  $("loginMsg").className="alert info";
  $("loginMsg").style.display="block";
  const ok=await pullSharedData();
  if(ok){
    $("loginMsg").textContent="Shared data connected successfully. shared_data.json is readable.";
    $("loginMsg").className="alert good";
  }else{
    let reason=sharedLastError||"unknown error";
    if(reason==="404")reason="404 — file not found at the URL above";
    else if(reason==="INVALID_JSON")reason="the response is not valid JSON";
    else if(/^\d+$/.test(reason))reason="HTTP "+reason;
    $("loginMsg").textContent="Shared data connection failed: "+reason+". Login will still work using the cached data.";
    $("loginMsg").className="alert bad";
  }
}

async function login(){
  const userEl=$('loginUser'), passEl=$('loginPass'), msgEl=$('loginMsg');
  const u=String(userEl?.value||'').trim(), p=String(passEl?.value||'');
  const showError=(msg)=>{if(msgEl){msgEl.textContent=msg;msgEl.className='alert bad';msgEl.style.display='block'}};
  if(!u||!p){showError('Enter username and password / PIN.');return false}
  if(msgEl){msgEl.textContent='Checking account…';msgEl.className='alert info';msgEl.style.display='block'}

  // IMPORTANT: authentication is deliberately local-first. Network/shared-file
  // operations must never be able to prevent the Login button from working.
  try{
    // Admin uses the same login page as every other account.
    if(u.toLowerCase()===String(adminAccount?.username||'admin').trim().toLowerCase()){
      if(p!==String(adminAccount?.password??'') || adminAccount?.enabled===false){showError('Invalid username or password.');return false}
      session={id:adminAccount.id||'admin',username:adminAccount.username||u,name:adminAccount.name||'Admin',role:'admin'};
      sessionStorage.setItem(STORE.session,JSON.stringify(session));
      activeBusinessId=null;
      try{applyTheme();applyLanguage()}catch(e){}
      try{logAdminAction('admin_login','Admin logged in')}catch(e){}
      try{
        const lock=await acquireAccountLock(session.id,'admin',null,session.name);
        if(!lock?.ok){session=null;sessionStorage.removeItem(STORE.session);showError(lock?.error==="lock_unavailable"?"Unable to verify active devices. Please check the connection and try again.":"Admin is already logged in on another device. Please log out there first.");renderLogin();return false}
        session.lockToken=lock.token;sessionStorage.setItem(STORE.session,JSON.stringify(session));startAccountLockHeartbeat();
      }catch(e){session=null;sessionStorage.removeItem(STORE.session);showError("Unable to verify active devices. Please check the connection and try again.");renderLogin();return false}
      adminDashboard();
      return true;
    }

    ensureBusinessRegistry();
    if(IS_NATIVE_APP){try{await pullBusinessRegistry()}catch(e){}}
    // Refresh the registry when the host serves it. Static hosts cannot create
    // or update JSON files, so they use the cached browser registry instead.
    if(/^https?:$/i.test(location.protocol)){
      let verified=false;
      try{
        const r=await fetch(new URL("business_registry.json",location.href).href+"?t="+Date.now(),{cache:"no-store",credentials:"same-origin"});
        if(r.ok){
          const remote=await r.json();
          if(Array.isArray(remote)){staticHostingFallback=false;businessRegistry=remote;write(BUSINESS_REGISTRY_STORE,businessRegistry);verified=true}
        }else if((r.status===404||r.status===405)&&businessRegistry.length){
          staticHostingFallback=true;
          verified=true;
        }
      }catch(e){verified=false}
      if(!verified){showError('Unable to verify your subscription. Please check the shared server connection and try again.');return false}
    }

    let found=null,foundBusiness=null,blockedBusiness=null,blockedReason="";
    for(const b of (businessRegistry||[])){
      if(IS_NATIVE_APP && !read('fb_business_data_'+b.id,null)){
        try{await loadBundledBusinessSnapshot(b.id)}catch(e){}
      }
      if(!b)continue;
      const li=licenseStatusInfo(b);
      if(li.status==='suspended' || li.status==='removed' || li.status==='expired'){
        const d=read('fb_business_data_'+b.id,null);
        const aa=Array.isArray(d?.accounts)?d.accounts:[];
        const matching=aa.find(x=>String(x.username||'').trim().toLowerCase()===u.toLowerCase() && (String(x.password??'')===p || String(x.pin??'')===p));
        if(matching){blockedBusiness=b;blockedReason=li.status;}
        continue;
      }
      if(b.status!=='active')continue;
      const d=read('fb_business_data_'+b.id,null);
      const aa=Array.isArray(d?.accounts)?d.accounts:[];
      const a=aa.find(x=>String(x.username||'').trim().toLowerCase()===u.toLowerCase() &&
        (String(x.password??'')===p || String(x.pin??'')===p) &&
        (x.role!=='staff' || x.enabled!==false));
      if(a){found=a;foundBusiness=b;break}
    }

    if(!found){if(blockedBusiness){showSubscriptionRequired(blockedBusiness,blockedReason);return false}showError('Invalid username/PIN, or this business license is suspended/expired.');return false}

    // A valid account is enough to enter the app. Shared device locking is optional.
    if(!enforceLicenseAccess(foundBusiness))return false;
    if(!loadBusinessSnapshot(foundBusiness.id)){
      if(!(IS_NATIVE_APP && await loadBundledBusinessSnapshot(foundBusiness.id)) || !loadBusinessSnapshot(foundBusiness.id)){
        showError('Account found, but business data could not be loaded on this device. Make sure the business JSON files are included in the APK.');
        return false;
      }
    }
    // Shared business data is synchronized after authentication. Do not make a
    // temporary shared_data.json read failure trap the user on the Login page;
    // the local business snapshot is sufficient to complete authentication,
    // while the server-authoritative license and account lock checks above
    // remain mandatory.
    if(/^https?:$/i.test(location.protocol)){
      try{
        const sharedOk=await pullSharedData();
        if(sharedOk) normalizeSharedData();
      }catch(e){ console.warn('Shared data read deferred until after login:',e); }
    }
    foundBusiness.lastActiveAt=new Date().toISOString();
    businessRegistry=businessRegistry.map(b=>String(b.id)===String(foundBusiness.id)?foundBusiness:b);

    session={id:found.id,username:found.username,name:found.name||found.username,role:found.role,businessId:foundBusiness.id};
    sessionStorage.setItem(STORE.session,JSON.stringify(session));
    try{
      const lock=await acquireAccountLock(found.id,'business',foundBusiness.id,session.name);
      if(!lock?.ok){
        sessionStorage.removeItem(STORE.session);session=null;
        if(lock?.error==="lock_unavailable") showError('Unable to verify active devices. Please check the connection and try again.');
        else showError('This account is already logged in on another device. Please log out there first.');
        renderLogin();return false;
      }
      session.lockToken=lock.token;
      sessionStorage.setItem(STORE.session,JSON.stringify(session));
      startAccountLockHeartbeat();
    }catch(e){
      sessionStorage.removeItem(STORE.session);session=null;
      showError('Unable to verify active devices. Please check the connection and try again.');
      renderLogin();return false;
    }
    document.body.classList.toggle('staff-home-only',!isOwner());
    try{applyTheme()}catch(e){}
    try{logAction('login',session.name+' logged in')}catch(e){}
    try{saveAll()}catch(e){}
    try{await syncBusinessActiveSession()}catch(e){}
    renderHome();
    if(/^https?:$/i.test(location.protocol)){bootSharedDatabase().then(()=>{if(session&&!isAdmin())render()}).catch(()=>{})}
    return true;
  }catch(err){
    console.error('Login error:',err);
    showError('Login could not be completed. Please refresh the page and try again.');
    return false;
  }
}

/* ------------------------- Stock ------------------------- */
/* ------------------------- Break-even / Item Recovery ------------------------- */
function breakEvenBalance(p){return p?num(p.breakEvenCostRemaining):0;}
function breakEvenRemainingCost(p){return Math.max(0,breakEvenBalance(p));}
function breakEvenProfit(p){return Math.max(0,-breakEvenBalance(p));}
function breakEvenQuantity(p){const remaining=breakEvenRemainingCost(p),price=num(p?.sell);if(remaining<=0)return 0;if(price<=0)return null;return Math.ceil((remaining/price)-1e-9);}
function breakEvenLabel(p){const q=breakEvenQuantity(p);if(q===null)return "Cannot calculate (selling price is ₹0)";const unit=p?.unitName||"Piece";return `${q} ${unit}${q===1?"":"s"} more to sell`;}
function breakEvenFinancialLabel(p){const balance=breakEvenBalance(p);return balance>0?`Cost remaining: ${money(balance)}`:`Profit: ${money(-balance)}`;}
function ensurePurchaseHistory(p){if(!p)return [];if(!Array.isArray(p.purchaseHistory)||!p.purchaseHistory.length)p.purchaseHistory=[{id:uid(),date:p.createdDate||displayDate(p.createdAt||now()),isoDate:p.createdAt?String(p.createdAt).slice(0,10):todayISO(),qty:num(p.qty),costPerUnit:num(p.purchase),sellPrice:num(p.sell),remainingQty:num(p.qty),by:p.createdBy||"Owner"}];p.sellingPriceMode=p.sellingPriceMode==="same"?"same":"lot";return p.purchaseHistory;}
function normalizeSellingPriceMode(p){if(!p)return;if(p.sellingPriceMode==="same")ensurePurchaseHistory(p).forEach(l=>l.sellPrice=num(p.sell));}
function addPurchaseLot(p,qty,costPerUnit,sellPrice){qty=num(qty);costPerUnit=num(costPerUnit);if(!p||qty<=0)return;const mode=p.sellingPriceMode==="same"?"same":"lot";sellPrice=num(mode==="same"?p.sell:(sellPrice??p.sell));const h=ensurePurchaseHistory(p);h.push({id:uid(),date:displayDate(now()),isoDate:todayISO(),time:timeNow(),qty,remainingQty:qty,costPerUnit,sellPrice,by:session?.name||"Owner",byAccountId:session?.id||"owner"});if(mode==="same")normalizeSellingPriceMode(p);}
function consumePurchaseCost(p,qty){qty=num(qty);if(!p||qty<=0)return 0;const h=ensurePurchaseHistory(p);let left=qty,cost=0;for(const lot of h){const avail=Math.max(0,num(lot.remainingQty??lot.qty));if(!avail)continue;const take=Math.min(avail,left);lot.remainingQty=avail-take;cost+=take*num(lot.costPerUnit);left-=take;if(left<=0)break;}if(left>0)cost+=(left*num(p.purchase));return cost;}
function restorePurchaseCost(p,qty,costUsed,sellPrice){qty=num(qty);if(!p||qty<=0)return;const unit=qty>0?num(costUsed)/qty:num(p.purchase);ensurePurchaseHistory(p).unshift({id:uid(),date:displayDate(now()),isoDate:todayISO(),time:timeNow(),qty,remainingQty:qty,costPerUnit:unit,sellPrice:num(sellPrice??p.sell),by:session?.name||"Owner",byAccountId:session?.id||"owner",restored:true});}
function availablePurchaseLots(p){return ensurePurchaseHistory(p).filter(l=>num(l.remainingQty??l.qty)>0);}
function effectiveSellingPrice(p,skipQty=0){if(!p)return 0;if(p.sellingPriceMode==="same")return num(p.sell);let skip=Math.max(0,num(skipQty));for(const lot of availablePurchaseLots(p)){const avail=num(lot.remainingQty??lot.qty);if(skip>=avail){skip-=avail;continue}return num(lot.sellPrice??p.sell)}return num(p.sell);}
function availableAtSellingPrice(p,price,skipQty=0){if(!p)return 0;if(p.sellingPriceMode==="same")return num(p.qty)-Math.max(0,num(skipQty));let skip=Math.max(0,num(skipQty)),total=0;for(const lot of availablePurchaseLots(p)){const avail=num(lot.remainingQty??lot.qty),lp=num(lot.sellPrice??p.sell);if(skip>=avail){skip-=avail;continue}const usable=avail-skip;skip=0;if(Math.abs(lp-num(price))<0.005)total+=usable;else if(total>0)break;}return total;}
function purchaseHistoryTotal(p){return ensurePurchaseHistory(p).reduce((a,l)=>a+num(l.qty)*num(l.costPerUnit),0);}

function applyBreakEvenForItems(items,direction=1){(items||[]).forEach(i=>{const p=products.find(x=>Number(x.id)===Number(i.id));if(!p)return;const gross=num(i.sell)*num(i.qty),disc=Math.min(Math.max(0,num(i.discount||0)),gross),recovered=Math.max(0,gross-disc);p.breakEvenCostRemaining=breakEvenBalance(p)-(direction*recovered);});}
function stockRecoveryAdjustment(p,change){if(!p||!change)return;p.breakEvenCostRemaining=breakEvenBalance(p)+num(change)*num(p.purchase);}

function stockState(p){const q=num(p.qty),critical=num(p.criticalStock),low=num(p.minStock);if(q<=0)return {key:"out",label:"OUT OF STOCK",cls:"stock-out"};if(q<=critical)return {key:"critical",label:"CRITICAL",cls:"stock-critical"};if(q<=low)return {key:"low",label:"LOW STOCK",cls:"stock-low"};return {key:"in",label:"IN STOCK",cls:"stock-in"};}

function purchaseHistoryPage(id){if(!requirePermission("stockView"))return;const p=products.find(x=>Number(x.id)===Number(id));if(!p)return;const h=ensurePurchaseHistory(p).slice().reverse();setContent(pageTitle("Purchase Cost History","stock")+`<div class="panel"><h3>${esc(p.name)}</h3><div class="small">Current stock: ${num(p.qty)} · Current purchase price: ${money(p.purchase)}</div><div class="small" style="margin-top:4px"><strong>Selling price mode:</strong> ${p.sellingPriceMode==="same"?"Same for all lots":"Different by lot"}</div><div style="margin-top:8px"><strong>Total recorded purchase cost</strong><div style="font-size:18px;font-weight:800">${money(purchaseHistoryTotal(p))}</div></div></div><div class="panel"><h3>Purchase Lots</h3>${h.map(l=>`<div class="transaction"><div class="row"><strong>${esc(l.date||"")}</strong><strong>${money(num(l.qty)*num(l.costPerUnit))}</strong></div><div class="small">${num(l.qty)} quantity × ${money(l.costPerUnit)} cost · Sell ${money(l.sellPrice??p.sell)} · Remaining ${num(l.remainingQty??l.qty)}${l.restored?" · Restored for bill edit":""}</div><div class="small">${esc(l.by||"Owner")}</div></div>`).join("")||`<div class="empty">No purchase history.</div>`}</div>`);}

function fifoSellingAllocations(p,qty,skipQty=0){
  qty=Math.max(0,Math.floor(num(qty)));
  let skip=Math.max(0,Math.floor(num(skipQty))),left=qty,out=[];
  if(!p||qty<=0)return out;
  if(p.sellingPriceMode==="same")return [{qty,price:num(p.sell)}];

  // DIFFERENT SELLING PRICE BY LOT: always start from the oldest lot that
  // still has stock. The product's current p.sell is NOT used while a
  // purchase lot with remaining quantity is available. This prevents a new
  // selling price from replacing the old lot's price.
  const lots=ensurePurchaseHistory(p).filter(l=>num(l.remainingQty??l.qty)>0);
  for(const lot of lots){
    let avail=Math.max(0,num(lot.remainingQty??lot.qty));
    if(skip>=avail){skip-=avail;continue;}
    avail-=skip;
    skip=0;
    const take=Math.min(avail,left);
    if(take>0){
      out.push({qty:take,price:num(lot.sellPrice),lotId:lot.id});
      left-=take;
    }
    if(left<=0)break;
  }
  // Only use the product price for legacy/inconsistent data where the
  // purchase history does not contain enough remaining stock.
  if(left>0)out.push({qty:left,price:num(p.sell),lotId:null,legacyFallback:true});
  return out;
}
function lineRevenue(i){
  if(Array.isArray(i.priceAllocations)&&i.priceAllocations.length)return i.priceAllocations.reduce((a,x)=>a+num(x.qty)*num(x.price),0);
  return num(i.sell)*num(i.qty);
}
function linePriceLabel(i){
  if(Array.isArray(i.priceAllocations)&&i.priceAllocations.length){
    const a=i.priceAllocations;
    const parts=[]; a.forEach(x=>{const key=money(x.price);const last=parts[parts.length-1];if(last&&last.price===key)last.qty+=num(x.qty);else parts.push({price:key,qty:num(x.qty)});});
    return parts.length===1?parts[0].price:parts.map(x=>`${x.qty} × ${x.price}`).join(" + ");
  }
  return money(i.sell);
}
function setCartFifoPricing(item,p,qty){
  const fifo=fifoSellingAllocations(p,qty);
  // If this bill uses more than one purchase lot with different selling prices,
  // charge the HIGHER selling price for the entire mixed quantity on this bill.
  // Stock consumption still remains FIFO; only the bill selling price is unified.
  const prices=[...new Set(fifo.map(x=>Number(x.price)))];
  if(p?.sellingPriceMode!=="same" && prices.length>1){
    const higher=Math.max(...prices);
    item.priceAllocations=[{qty:Math.max(0,Math.floor(num(qty))),price:higher,lotId:null,mixedLots:true}];
    item.sell=higher;
  }else{
    item.priceAllocations=fifo;
    const revenue=lineRevenue(item); item.sell=qty>0?revenue/qty:num(p?.sell);
  }
  item.purchase=num(p?.purchase);
}

function billingLineDiscounts(subtotal, totalDiscount){
  const type=window.billDiscountType==="item"?"item":"overall";
  if(type==="item") return cart.map(i=>Math.min(Math.max(0,num(i.discount||0)),lineRevenue(i)));
  const d=Math.min(Math.max(0,num(totalDiscount)),subtotal);
  if(!cart.length||subtotal<=0)return cart.map(()=>0);
  let out=cart.map(i=>((lineRevenue(i))/subtotal)*d);
  // Keep the distributed amount exactly equal to the overall discount.
  const rounded=out.map(x=>Math.round(x*100)/100);
  const diff=Math.round((d-rounded.reduce((a,b)=>a+b,0))*100)/100;
  if(rounded.length)rounded[rounded.length-1]=Math.max(0,Math.round((rounded[rounded.length-1]+diff)*100)/100);
  return rounded;
}

  else discount=Math.min(Math.max(0,num(window.billDiscount)),subtotal);

function updateBillingView(){
  const {subtotal,discount,total}=billingTotals();
  const paid=Math.max(0,billingCash)+Math.max(0,billingOnline);
  const due=Math.max(0,total-paid);
  if($("billSubtotal")) $("billSubtotal").textContent=money(subtotal);
  if($("billGrandTotal")) $("billGrandTotal").textContent=money(total);
  updateCustomerBillAmountSummary();
  if($("billOutstanding")){
    $("billOutstanding").textContent=money(due);
    $("billOutstanding").className=due>0?"bad":"good";
  }
  if($("billingPaymentError")){
    $("billingPaymentError").innerHTML=paid>total?`<div class="alert bad">Payment exceeds the grand total by ${money(paid-total)}. Reduce cash/online amount.</div>`:"";
  }
  // Keep the recurring-customer amount summary live whenever bill totals change.
  updateCustomerBillAmountSummary();
}

  const i=cart.find(x=>Number(x.id)===Number(id)); if(!i)return;
  const max=num(i.sell)*num(i.qty);
  i.discount=Math.min(Math.max(0,num(value)),max,staffMaxDiscountPct()/100*max);
  if(!window.billPaymentTouched){

    const pm=settings.defaultPaymentMethod||"cash";
    if(pm==="cash"){billingCash=total;billingOnline=0}
    else if(pm==="online"){billingCash=0;billingOnline=total}
    else {billingCash=0;billingOnline=0}
  }
  updateBillingView();
}

function addCart(){
  syncBillingCustomerFields();
  const qtyInput=$("bq"),rawQty=qtyInput?.value??window.billQty,q=Math.floor(num(rawQty));
  const p=products.find(x=>Number(x.id)===Number(selectedProductId));
  if(!p){flashMsg("Select a product first.","bad");return}
  if(!String(rawQty||"").trim()||q<=0){flashMsg("Enter quantity first.","bad");return}
  if(num(p.qty)<=0){flashMsg("This item is out of stock.","bad");return}
  const already=cart.filter(x=>Number(x.id)===Number(p.id)).reduce((a,x)=>a+num(x.qty),0);
  if(already+q>num(p.qty)){flashMsg("Not enough stock available.","bad");return}

  // Selling price follows the purchase-history lots FIFO: oldest available lot first,
  // then the next lot only after the older lot is exhausted.
  const totalQty=already+q;
  const allocations=fifoSellingAllocations(p,totalQty);
  if(allocations.reduce((a,x)=>a+num(x.qty),0)!==totalQty){flashMsg("Unable to allocate FIFO selling-price lots.","bad");return}
  const same=cart.filter(x=>Number(x.id)===Number(p.id));
  const existing=same[0];
  if(existing){
    existing.qty=totalQty;
    setCartFifoPricing(existing,p,totalQty);
    for(let j=1;j<cart.length;){if(Number(cart[j].id)===Number(p.id))cart.splice(j,1);else j++;}
  }else{
    const item={id:p.id,name:p.name,sell:0,purchase:num(p.purchase),qty:q};
    setCartFifoPricing(item,p,q);
    cart.push(item);
  }
  selectedProductId=null;window.billSearch="";window.billQty="";renderBilling();
}
function changeCartQty(id,d){
  syncBillingCustomerFields();
  const i=cart.find(x=>Number(x.id)===Number(id));if(!i)return;
  const p=products.find(x=>Number(x.id)===Number(id));const q=Math.max(1,num(i.qty)+d);
  if(q>num(p?.qty)){flashMsg("Not enough stock.","bad");return}
  i.qty=q;setCartFifoPricing(i,p,q);renderBilling();
}

}

async function saveBill(){
  if(!closedDayGuardForCurrentTransaction("create a new bill"))return;
  if(sharedDbReady && !sharedBooting)await pullSharedData();
  const {subtotal,discount,total,lineDiscounts}=billingTotals();
  const cash=Math.max(0,num($("cashAmount").value)),online=Math.max(0,num($("onlineAmount").value)),paid=cash+online;
  if(!cart.length){flashMsg("Add at least one product.","bad");return}
  if(paid>total+.009){flashMsg("Cash + Online cannot exceed Grand Total.","bad");return}
  if(!isOwner() && discount>billingTotalsBaseSubtotal()*staffMaxDiscountPct()/100+.009){flashMsg("Discount exceeds your maximum permitted discount of "+staffMaxDiscountPct()+"%.","bad");return}
  const customer=$("cn").value.trim()||"Walk-in Customer",mobile=$("cm").value.trim();
  if(window.editingBillId){saveEditedBill(window.editingBillId,subtotal,discount,total,cash,online,customer,mobile);return}
  const invoiceNo="INV-"+(++invoiceCounter);
  const billItems=cart.map((x,idx)=>({...x,discount:num(lineDiscounts[idx]||0)}));
  cart.forEach((i,idx)=>{const p=products.find(x=>Number(x.id)===Number(i.id));if(p){const used=consumePurchaseCost(p,num(i.qty));billItems[idx].costUsed=used;p.qty-=num(i.qty);recordStockLedger(p.id,"Sale",-num(i.qty),num(used)/Math.max(1,num(i.qty)),invoiceNo,"Stock sold");}});
  const profit=cart.reduce((a,i,idx)=>a+(num(i.sell)*num(i.qty)-num(billItems[idx]?.costUsed??(num(i.purchase)*num(i.qty)))),0)-discount;
  applyBreakEvenForItems(billItems,1);
  const createdAudit=auditStamp();
  const ownerAccount=accounts.find(a=>a.role==="owner")||accounts[0];
  const isOwnerBill=!!ownerAccount && customer.trim().toLowerCase()===String(ownerAccount.name||"Owner").trim().toLowerCase();
  const s={id:uid(),invoiceNo,customer,mobile,items:billItems,subtotal,discount,total,profit,breakEvenApplied:true,isOwnerBill,discountType:window.billDiscountType==="item"?"item":"overall",
    cashAmount:cash,onlineAmount:online,paidAmount:paid,dueAmount:Math.max(0,total-paid),
    paymentStatus:paid>=total-.009?"paid":paid>0?"partial":"unpaid",...createdAudit,isoDate:todayISO(),time:timeNow(),
    staffId:session.id,staffUsername:session.username,staffName:session.name,
    paymentHistory:[{id:uid(),type:"Bill Payment",amount:paid,cashAmount:cash,onlineAmount:online,remaining:Math.max(0,total-paid),date:displayDate(now()),isoDate:new Date().toISOString(),time:timeNow(),by:session.name,byAccountId:session.id,comment:"Bill created · Cash "+money(cash)+" · Online "+money(online)}],
    comments:[{id:uid(),date:displayDate(now()),time:timeNow(),text:"Bill created · Cash "+money(cash)+" · Online "+money(online)+" · Outstanding "+money(Math.max(0,total-paid)),by:session.name,type:"Payment"}]};
  sales.push(s);
  if(customer!=="Walk-in Customer"){
    let c=customers.find(x=>mobile&&x.mobile===mobile);
    if(!c) customers.push({id:uid(),name:customer,mobile,total:0,lastPurchase:displayDate(now()),...auditStamp()});
    else {c.name=customer;c.lastPurchase=displayDate(now())}
  }
  syncCustomerTotals();
  rebuildTransactions();
  logAction("sale","Created "+invoiceNo,{invoiceId:s.id});
  saveAll();
  const sharedSaved=await pushSharedData();
  cart=[];billingCash=0;billingOnline=0;window.billDiscount="";window.billDiscountType="overall";window.billSearch="";window.billCustomer="";window.billMobile="";window.editingBillId=null;window.billInitialized=false;window.billPaymentTouched=false;
  viewSavedBill(s.id);
  flashMsg(sharedSaved?"Bill saved and shared with all devices.":"Bill saved on this device, but shared_data.json could not be updated. Check SHTTP file modification/WebDAV.","bad");
}
async function saveEditedBill(id,subtotal,discount,total,cash,online,customer,mobile){
  if(sharedDbReady && !sharedBooting)await pullSharedData();
  const s=sales.find(x=>Number(x.id)===Number(id));if(!s)return;
  if(!requireSaleDayOpen(s,"edit this bill"))return;
  // Return old stock and reverse its recovery contribution, then apply edited quantities.
  (s.items||[]).forEach(i=>{const p=products.find(x=>Number(x.id)===Number(i.id));if(p){p.qty+=num(i.qty);restorePurchaseCost(p,num(i.qty),num(i.costUsed??(num(i.purchase)*num(i.qty))),num(i.sell));recordStockLedger(p.id,"Bill Edit Return",num(i.qty),num(i.costUsed??(num(i.purchase)*num(i.qty)))/Math.max(1,num(i.qty)),s.invoiceNo||"","Returned stock during bill edit");if(s.breakEvenApplied)applyBreakEvenForItems([i],-1);}});
  for(const i of cart){const p=products.find(x=>Number(x.id)===Number(i.id));if(!p||num(p.qty)<num(i.qty)){(s.items||[]).forEach(j=>{const p2=products.find(x=>Number(x.id)===Number(j.id));if(p2)p2.qty-=num(j.qty)});flashMsg("Not enough stock for the edited bill.","bad");return}}
  cart.forEach(i=>{const p=products.find(x=>Number(x.id)===Number(i.id));if(p){i.costUsed=consumePurchaseCost(p,num(i.qty));p.qty-=num(i.qty);recordStockLedger(p.id,"Bill Edit Sale",-num(i.qty),num(i.costUsed)/Math.max(1,num(i.qty)),s.invoiceNo||"","Stock consumed by edited bill");}});
  const oldHistory=Array.isArray(s.paymentHistory)?s.paymentHistory:[];
  const initial=oldHistory.find(p=>p.type==="Bill Payment");
  const oldCollected=oldHistory.filter(p=>p.type==="Outstanding Payment").reduce((a,p)=>a+num(p.amount),0);
  const paid=cash+online,totalPaid=paid+oldCollected,due=Math.max(0,total-totalPaid);
  if(initial){
    initial.amount=paid;initial.cashAmount=cash;initial.onlineAmount=online;
    initial.remaining=Math.max(0,total-paid);initial.byAccountId=s.staffId||session.id;
    initial.by=session.name;
    initial.comment="Bill payment updated · Cash "+money(cash)+" · Online "+money(online);
  }else{
    oldHistory.unshift({id:uid(),type:"Bill Payment",amount:paid,cashAmount:cash,onlineAmount:online,remaining:Math.max(0,total-paid),
      date:displayDate(now()),isoDate:s.createdAt||new Date().toISOString(),time:s.time||timeNow(),by:s.staffName||session.name,
      byAccountId:s.staffId||session.id,comment:"Initial bill payment"});
  }
  s.paymentHistory=oldHistory;
  s.customer=customer;s.mobile=mobile;s.items=cart.map((x,idx)=>({...x,discount:num(billingTotals().lineDiscounts[idx]||0),costUsed:num(x.costUsed??(num(x.purchase)*num(x.qty)))}));applyBreakEvenForItems(s.items,1);s.breakEvenApplied=true;s.subtotal=subtotal;s.discount=discount;s.total=total;s.discountType=window.billDiscountType==="item"?"item":"overall";
  const ownerAccount=accounts.find(a=>a.role==="owner")||accounts[0];
  s.isOwnerBill=!!ownerAccount && customer.trim().toLowerCase()===String(ownerAccount.name||"Owner").trim().toLowerCase();
  s.cashAmount=cash;s.onlineAmount=online;s.paidAmount=totalPaid;s.dueAmount=due;s.paymentStatus=due<=.009?"paid":totalPaid>0?"partial":"unpaid";auditUpdate(s,"Edited Bill");
  s.profit=cart.reduce((a,i)=>a+(num(i.sell)*num(i.qty)-num(i.costUsed??(num(i.purchase)*num(i.qty)))),0)-discount;
  s.comments=(s.comments||[]).concat({id:uid(),date:displayDate(now()),time:timeNow(),text:"Bill edited · Cash "+money(cash)+" · Online "+money(online)+" · Outstanding "+money(due),by:session.name,type:"Edit"});
  syncCustomerTotals();
  rebuildTransactions();
  logAction("sale","Edited "+s.invoiceNo,{invoiceId:s.id});
  saveAll();
  const sharedSaved=await pushSharedData();
  cart=[];billingCash=0;billingOnline=0;window.editingBillId=null;viewSavedBill(s.id);
  flashMsg(sharedSaved?"Bill updated and shared with all devices.":"Bill updated locally, but shared_data.json could not be updated. Check SHTTP file modification/WebDAV.","bad");
}

function formatBusinessTime(t){

  return `${hh}:${m} ${ap}`;
}

function pdfEscapeText(v){return String(v==null?"":v).replace(/₹/g,"INR ").replace(/[^\x00-\x7F]/g,"?").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").replace(/\r?\n/g," ");}
function buildInvoicePdf(s){
  const lines=[];
  const add=(v="")=>lines.push(String(v));
  add(settings.businessName||"Firecracker Business");
  if(settings.businessAddress)add(settings.businessAddress);
  if(settings.businessMobile)add("Mobile: "+settings.businessMobile);
  if(settings.gstin)add("GSTIN: "+settings.gstin);
  add("");
  add("INVOICE  "+(s.invoiceNo||"-"));
  add("Customer: "+(s.customer||"Walk-in Customer"));
  if(settings.invoiceShowCustomerMobile&&s.mobile)add("Mobile: "+s.mobile);
  if(settings.invoiceShowDateTime)add("Date: "+(s.isoDate||"")+" "+(s.time||""));
  if(settings.invoiceShowStaffName&&s.staffName)add("Staff: "+s.staffName);
  add("");
  (s.items||[]).forEach(i=>{const gross=num(i.sell)*num(i.qty);const disc=s.discountType==="item"?Math.min(Math.max(0,num(i.discount||0)),gross):(s.subtotal>0?gross*num(s.discount)/num(s.subtotal):0);const net=Math.max(0,gross-disc);add(`${i.name}  x${num(i.qty)}  ${money(net)} (${money(gross)})`);});
  add("");
  add("Subtotal: "+money(s.subtotal));
  add("Discount: "+money(s.discount));
  add("Grand Total: "+money(s.total));
  if(settings.invoiceShowPaymentMethod)add("Payment: "+invoicePaymentMethodLabel(s));
  if(settings.invoiceShowOutstanding)add("Outstanding: "+money(s.dueAmount));
  if(settings.invoiceShowFooter&&settings.invoiceFooter){add("");String(settings.invoiceFooter).split(/\r?\n/).forEach(add)}
  if(settings.invoiceShowThankYou){add("");add("Thank you for your business.");}
  const maxChars=68, wrapped=[];
  lines.forEach(line=>{let x=String(line);if(!x){wrapped.push("");return}while(x.length>maxChars){wrapped.push(x.slice(0,maxChars));x=x.slice(maxChars)}wrapped.push(x)});
  const pageHeight=792, margin=42, leading=15, maxLines=Math.floor((pageHeight-margin*2-20)/leading);
  const pages=[];for(let i=0;i<wrapped.length;i+=maxLines)pages.push(wrapped.slice(i,i+maxLines));
  const objects=[];const offsets=[];let pdf="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";
  const addObj=(body)=>{const n=objects.length+1;objects.push(`${n} 0 obj\n${body}\nendobj\n`);return n};
  const font=addObj("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
  const pageNums=[]; const contentNums=[];
  pages.forEach(page=>{
    let stream="BT\n/F1 10 Tf\n";let y=750;
    page.forEach(line=>{stream+=`1 0 0 1 ${margin} ${y} Tm (${pdfEscapeText(line)}) Tj\n`;y-=leading});stream+="ET\n";
    const content=addObj(`<< /Length ${stream.length} >>\nstream\n${stream}endstream`);contentNums.push(content);
    pageNums.push(addObj("PAGE_PLACEHOLDER"));
  });
  const pagesObj=objects.length+1;
  pages.forEach((_,idx)=>{objects[pageNums[idx]-1]=`${pageNums[idx]} 0 obj\n<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${contentNums[idx]} 0 R >>\nendobj\n`;});
  addObj(`<< /Type /Pages /Kids [${pageNums.map(n=>n+" 0 R").join(" ")}] /Count ${pageNums.length} >>`);
  const catalog=addObj(`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`);
  const finalObjs=objects;const header=pdf;let out=header;
  finalObjs.forEach(obj=>{offsets.push(out.length);out+=obj});
  const xref=out.length;out+=`xref\n0 ${finalObjs.length+1}\n0000000000 65535 f \n`;offsets.forEach(o=>{out+=String(o).padStart(10,"0")+" 00000 n \n"});
  out+=`trailer\n<< /Size ${finalObjs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([out],{type:"application/pdf"});
}

function downloadFinanceExcel(){
  if(!requirePermission("finance"))return;
  const from=window.financeFrom||"",to=window.financeTo||"";
  const fs=financeFilteredSales(from,to),fe=financeFilteredExpenses(from,to),ft=financeFilteredTransactions(from,to);

  const grossProfit=fs.reduce((a,x)=>a+num(x.profit),0);
  const expensesTotal=fe.reduce((a,x)=>a+num(x.amount),0);
  const cash=ft.reduce((a,x)=>a+num(x.cash),0);
  const online=ft.reduce((a,x)=>a+num(x.online),0);
  const outstanding=ft.filter(x=>x.type==="Outstanding Payment").reduce((a,x)=>a+num(x.amount),0);
  const escXml=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");
  const cell=(v,type="String")=>`<Cell><Data ss:Type="${type}">${escXml(v)}</Data></Cell>`;
  const row=(arr,types=[])=>`<Row>${arr.map((v,i)=>cell(v,types[i]||"String")).join("")}</Row>`;
  const period=from&&to?(from===to?from:`${from} to ${to}`):from?`From ${from}`:to?`Up to ${to}`:"All time";
  const summary=[
    row(["Financial Period",period]),
    row(["Sales",revenue,"Gross Profit",grossProfit,"Expenses",expensesTotal,"Net Profit",grossProfit-expensesTotal,"Cash Collected",cash,"Online Collected",online,"Outstanding Paid",outstanding], ["String","String","String","Number","String","Number","String","Number","String","Number","String","Number","String","Number"])
  ].join("");
  const historyHeader=row(["Date","Time","Type","Invoice No","Customer","Amount","Cash","Online","Created By","Comment"]);
  const history=ft.slice().sort((a,b)=>String(b.at||b.date+" "+b.time).localeCompare(String(a.at||a.date+" "+a.time))).map(t=>row([t.date||"",t.time||"",t.type||"",t.invoiceNo||"",t.customer||"",num(t.amount),num(t.cash),num(t.online),t.by||"Owner",t.comment||""],["String","String","String","String","String","Number","Number","Number","String","String"])).join("");
  const xml='<?xml version="1.0" encoding="UTF-8"?>'+
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
    '<Worksheet ss:Name="Finance Summary"><Table>'+summary+'</Table></Worksheet>'+
    '<Worksheet ss:Name="Transactions"><Table>'+historyHeader+history+'</Table></Worksheet></Workbook>';
  const blob=new Blob(['\uFEFF'+xml],{type:'application/vnd.ms-excel;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='Finance_'+(from&&to?from+'_'+to:'All_Time')+'.xls';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  flashMsg(ft.length+' financial records exported to Excel.','good');
}

function getDayClosing(date=todayISO()){
  return (closings||[]).find(c=>String(c.date)===String(date) && c.type!=='month' && c.type!=='season')||null;
}
function isDayLocked(date=todayISO()){
  return !!getDayClosing(date);
}
function dayLockMessage(date=todayISO()){

  return `Day ${date} is closed by ${c.closedBy||"Owner"}. Transactions for this day are locked.`;
}
function requireDayOpen(date=todayISO(),action="make changes"){
  if(isAdmin())return true;
  if(!isDayLocked(date))return true;
  flashMsg(`Day is closed. You cannot ${action} for ${date}. Only the Owner can reopen the day.`,"bad");
  return false;
}
function requireSaleDayOpen(s,action="edit this bill"){
  const d=String(s?.isoDate||s?.createdAt||todayISO()).slice(0,10);

function reopenDay(date=todayISO()){
  if(!requireOwner())return;
  const c=getDayClosing(date);
  if(!c){flashMsg("That day is not closed.","bad");return;}
  const reason=prompt(`Reopen ${date}? Enter a reason:`);
  if(reason===null)return;
  const r=reason.trim();
  if(!r){flashMsg("A reason is required to reopen a closed day.","bad");return;}
  closings=closings.filter(x=>String(x.id)!==String(c.id));
  saveAll();
  logAction("closing-reopen",`Reopened day ${date}`,{date,reason:r,originalClosingId:c.id});
  saveAll();
  flashMsg(`Day ${date} reopened. Transactions can be recorded again.`,"good");
  dayClosingPage();
}
function closedDayGuardForCurrentTransaction(action){

}

function closeDayForDate(targetDate,closedBy="Automatic 12:00 AM"){

  const dayExpenses=expenses.filter(e=>(e.isoDate||"")===targetDate);
  const cashBills=daySales.reduce((a,s)=>a+num(s.cashAmount),0);
  const onlineBills=daySales.reduce((a,s)=>a+num(s.onlineAmount),0);
  const cashExpenses=dayExpenses.filter(e=>(e.mode||"Cash")==="Cash").reduce((a,e)=>a+num(e.amount),0);
  const opening=calculatedOpeningCash();
  const expected=opening+cashBills-cashExpenses;
  const c={id:uid(),date:targetDate,closedAt:new Date().toISOString(),closedBy,
    bills:daySales.length,sales:daySales.reduce((a,s)=>a+num(s.total),0),
    cash:cashBills,online:onlineBills,
    outstandingCreated:daySales.reduce((a,s)=>a+initialOutstanding(s),0),
    outstandingCollected:0,outstandingCashCollected:0,outstandingOnlineCollected:0,
    profit:daySales.reduce((a,s)=>a+num(s.profit),0),
    expenses:dayExpenses.reduce((a,e)=>a+num(e.amount),0),
    netProfit:daySales.reduce((a,s)=>a+num(s.profit),0)-dayExpenses.reduce((a,e)=>a+num(e.amount),0),
    openingCash:opening,expectedCash:expected,actualCash:expected,difference:0,
    notes:"Automatic midnight day close",autoClosed:true};
  closings.push(c);
  settings.lastAutoClosedDate=targetDate;
  saveAll();
  logAction("closing","Automatically closed day "+targetDate+" at midnight");
  saveAll();
  return true;
}
function runAutomaticDayClose(){
  if(settings.dayCloseMode!=="automatic" && settings.dayCloseMode!=="manualAutomatic")return;
  const nowTime=new Date();
  // At any time after midnight, ensure the previous calendar day is closed.
  // This makes the feature reliable even if the app was not open exactly at 12:00.
  const target=previousISO();
  if(settings.lastAutoClosedDate===target)return;
  if(closeDayForDate(target,"Automatic 12:00 AM")){
    settings.lastAutoClosedDate=target;
    saveAll();
  }
}

function phase4NormalizeMobile(v){
  let m=String(v||"").replace(/\D/g,"");
  if(m.length===10)m="91"+m;
  if(m.startsWith("00"))m=m.slice(2);
  return m;
}
function phase4WhatsAppUrl(mobile,text){
  const m=phase4NormalizeMobile(mobile);
  return m?`https://wa.me/${m}?text=${encodeURIComponent(text)}`:`https://wa.me/?text=${encodeURIComponent(text)}`;
}
function customerOutstandingAmount(c){
  const mobile=String(c.mobile||"").trim();
  return (sales||[]).filter(s=>mobile&&String(s.mobile||"").trim()===mobile).reduce((a,s)=>a+Math.max(0,num(s.dueAmount)),0);
}
function customerWhatsAppMessage(c){
  const due=customerOutstandingAmount(c),shop=settings.businessName||"Firecracker Business";
  return `Hello ${c.name||"Customer"}, this is ${shop}. ${due>0?`Your outstanding amount is ${money(due)}. Please arrange payment at your convenience.`:`Thank you for shopping with us! We appreciate your business.`}`;
}

function advancedAnalyticsPage(){
  if(!requirePermission("finance")&&!requireOwner())return;
  const days=Math.max(7,Math.min(90,num(window.analyticsDays||30))),end=new Date(),start=new Date();start.setDate(end.getDate()-days+1);
  const inRange=d=>{const x=financeDateValue(d);const a=start.toISOString().slice(0,10),b=end.toISOString().slice(0,10);return x>=a&&x<=b};
  const ss=(sales||[]).filter(s=>inRange(s.isoDate||s.createdAt)), ex=(expenses||[]).filter(e=>inRange(e.isoDate||e.createdAt));
  const revenue=ss.reduce((a,s)=>a+num(s.total),0),profit=ss.reduce((a,s)=>a+num(s.profit),0),expense=ex.reduce((a,e)=>a+num(e.amount),0),net=profit-expense;

async function usernameExistsAnywhere(username,excludeId=""){
  const q=String(username||"").trim().toLowerCase();
  if(!q)return false;
  if(String(adminAccount.username||"").toLowerCase()===q)return true;
  for(const b of businessRegistry){
    let d=read("fb_business_data_"+b.id,null);
    if(/^https?:$/i.test(location.protocol)){
      try{const r=await fetch(new URL("shared_data_"+b.id+".json",location.href).href+"?t="+Date.now(),{cache:"no-store",credentials:"same-origin"});if(r.ok)d=await r.json()}catch(e){}
    }
    for(const a of (d?.accounts||[])){if(String(a.id)!==String(excludeId)&&String(a.username||"").trim().toLowerCase()===q)return true;}
  }
  return false;
}
