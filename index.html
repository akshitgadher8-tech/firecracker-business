/* ------------------------- Keyboard / input stability ------------------------- */
// Never replace an input element while the user is typing. This is especially
// important in Android WebView, where replacing the focused input dismisses Gboard.
document.addEventListener("input",function(e){
  const el=e.target;
  if(!(el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement))return;
  el.setAttribute("autocomplete","off");
},true);
// Keep numeric fields as text inputs with inputmode so Android shows a numeric
// keyboard without the browser's number-input validation/focus quirks.
document.addEventListener("keydown",function(e){
  const el=e.target;
  if(!(el instanceof HTMLInputElement))return;
  if(el.inputMode==="numeric" || el.inputMode==="decimal"){
    if(e.key==="Enter") e.preventDefault();
  }
},true);

/* ------------------------- Single-account device lock ------------------------- */
const ACCOUNT_LOCK_FILE="account_locks.json";
const ACCOUNT_LOCK_TTL=90000;
let accountLockHeartbeat=null;
function accountLockUrl(){return new URL(ACCOUNT_LOCK_FILE,location.href).href}
function accountLockItemUrl(id){return new URL("account_lock_"+encodeURIComponent(String(id))+".json",location.href).href}
function lockStore(){return read("fb_account_locks",{})||{}}
function localLockActive(id){const locks=lockStore(),x=locks[String(id)];return !!(x&&Number(x.expiresAt)>Date.now())}
function setLocalLock(id,token,meta){const locks=lockStore();locks[String(id)]={token,...meta,expiresAt:Date.now()+ACCOUNT_LOCK_TTL};write("fb_account_locks",locks)}
function clearLocalLock(id,token){const locks=lockStore();if(locks[String(id)]?.token===token){delete locks[String(id)];write("fb_account_locks",locks)}}

/*
 * Cross-device account locking is server-authoritative.
 * A single shared JSON file cannot safely implement "first device wins" because
 * two devices can GET it at the same time and then overwrite each other with PUT.
 * Therefore each account gets its own lock resource and creation uses
 * If-None-Match: *. A server that supports WebDAV/conditional PUT will atomically
 * reject the second device with HTTP 412. If the server does not support this,
 * business login fails closed instead of allowing duplicate logins.
 */
async function fetchAccountLock(id){
  if(!/^https?:$/i.test(location.protocol))return lockStore()[String(id)]||null;
  const r=await fetch(accountLockItemUrl(id)+"?t="+Date.now(),{cache:"no-store",credentials:"same-origin"});
  if(r.status===404)return null;
  if(!r.ok)throw new Error("LOCK_GET_"+r.status);
  const d=await r.json();
  if(!d||typeof d!=="object")return null;
  return {...d,_etag:r.headers.get("ETag")||r.headers.get("Etag")||""};
}
async function createServerAccountLock(meta){
  const r=await fetch(accountLockItemUrl(meta.accountId),{method:"PUT",headers:{"Content-Type":"application/json;charset=UTF-8","If-None-Match":"*"},body:JSON.stringify(meta,null,2),credentials:"same-origin"});
  if(r.ok)return {ok:true};
  if(r.status===412 || r.status===409)return {ok:false,reason:"already_locked"};
  return {ok:false,reason:"server_error",status:r.status};
}
async function replaceServerAccountLock(meta,etag){
  const headers={"Content-Type":"application/json;charset=UTF-8"};
  if(etag)headers["If-Match"]=etag;
  else headers["If-Match"]="*";
  const r=await fetch(accountLockItemUrl(meta.accountId),{method:"PUT",headers,body:JSON.stringify(meta,null,2),credentials:"same-origin"});
  return r.ok;
}
async function deleteServerAccountLock(id,etag){
  const headers={};
  if(etag)headers["If-Match"]=etag;
  const r=await fetch(accountLockItemUrl(id),{method:"DELETE",headers,credentials:"same-origin"});
  return r.ok || r.status===404;
}

async function fetchAccountLocks(){
  if(!/^https?:$/i.test(location.protocol))return lockStore();
  try{
    const r=await fetch(accountLockUrl()+"?t="+Date.now(),{cache:"no-store",credentials:"same-origin"});
    if(!r.ok)return lockStore();
    const d=await r.json();
    return d&&typeof d==="object"?d:lockStore();
  }catch(e){return lockStore()}
}
async function writeAccountLocks(locks){
  if(!/^https?:$/i.test(location.protocol)){write("fb_account_locks",locks);return true}
  try{
    const r=await fetch(accountLockUrl(),{method:"PUT",headers:{"Content-Type":"application/json;charset=UTF-8"},body:JSON.stringify(locks,null,2),credentials:"same-origin"});
    return r.ok;
  }catch(e){return false}
}

async function acquireAccountLock(accountId,kind,businessId,name){
  const id=String(accountId),token=uid()+"-"+Math.random().toString(36).slice(2),nowMs=Date.now();
  const meta={token,accountId:id,kind,businessId:businessId||"",name:name||"",device:getDeviceId(),createdAt:new Date(nowMs).toISOString(),expiresAt:nowMs+ACCOUNT_LOCK_TTL,updatedAt:new Date(nowMs).toISOString()};

  if(IS_NATIVE_APP || staticHostingFallback || !/^https?:$/i.test(location.protocol)){
    const locks=lockStore(),existing=locks[id];
    // Native/offline builds have only device-local locking. If the same device
    // already owns the lock (for example after reopening the APK), refresh it
    // instead of treating the stale local record as another-device login.
    if(existing&&Number(existing.expiresAt)>nowMs){
      if(String(existing.device||"")===String(getDeviceId())){
        locks[id]={...existing,...meta,token};
        write("fb_account_locks",locks);setLocalLock(id,token,locks[id]);return {ok:true,token};
      }
      return {ok:false,error:"already_locked"};
    }
    locks[id]=meta;write("fb_account_locks",locks);setLocalLock(id,token,meta);return {ok:true,token};
  }

  // First try the atomic create. Never fall back to a non-atomic shared-file PUT.
  try{
    const created=await createServerAccountLock(meta);
    if(created.ok){setLocalLock(id,token,meta);return {ok:true,token};}
    if(created.reason!=="already_locked")return {ok:false,error:"lock_unavailable"};

    // Existing lock: only the owner of an expired lock may remove it, and the
    // conditional DELETE prevents two devices from both replacing it.
    const existing=await fetchAccountLock(id);
    if(existing&&Number(existing.expiresAt)>Date.now())return {ok:false,error:"already_locked"};
    if(!existing)return {ok:false,error:"lock_unavailable"};
    const removed=await deleteServerAccountLock(id,existing._etag||"");
    if(!removed)return {ok:false,error:"lock_unavailable"};

    // Re-create after the conditional delete. Another device can win this race;
    // If-None-Match makes sure only one of them succeeds.
    const retry=await createServerAccountLock(meta);
    if(!retry.ok)return {ok:false,error:retry.reason==="already_locked"?"already_locked":"lock_unavailable"};
    setLocalLock(id,token,meta);return {ok:true,token};
  }catch(e){
    return {ok:false,error:"lock_unavailable"};
  }
}

async function renewAccountLock(){
  if(!session?.id||!session.lockToken)return;
  const id=String(session.id),token=session.lockToken;
  if(!IS_NATIVE_APP && !staticHostingFallback && /^https?:$/i.test(location.protocol)){
    try{
      const x=await fetchAccountLock(id);
      if(!x || x.token!==token){await logout();return}
      if(Number(x.expiresAt)<=Date.now()){await logout();return}
      const meta={...x,token,accountId:id,kind:session.role==="admin"?"admin":"business",businessId:session.businessId||"",name:session.name||"",device:getDeviceId(),expiresAt:Date.now()+ACCOUNT_LOCK_TTL,updatedAt:new Date().toISOString()};
      delete meta._etag;
      const ok=await replaceServerAccountLock(meta,x._etag||"");
      if(!ok){await logout();return}
      setLocalLock(id,token,meta);
    }catch(e){return}
  }else{
    const locks=lockStore(),x=locks[id];
    if(!x||x.token!==token){await logout();return}
    locks[id]={...x,expiresAt:Date.now()+ACCOUNT_LOCK_TTL,updatedAt:new Date().toISOString()};write("fb_account_locks",locks);setLocalLock(id,token,locks[id]);
  }
  try{await syncBusinessActiveSession()}catch(e){}
}

async function releaseAccountLock(){
  if(!session?.id||!session?.lockToken)return;
  const id=String(session.id),token=session.lockToken;
  clearLocalLock(id,token);
  if(!IS_NATIVE_APP && !staticHostingFallback && /^https?:$/i.test(location.protocol)){
    try{
      const x=await fetchAccountLock(id);
      if(x&&x.token===token)await deleteServerAccountLock(id,x._etag||"");
    }catch(e){}
  }else{
    try{const locks=lockStore();if(locks[id]?.token===token){delete locks[id];write("fb_account_locks",locks)}}catch(e){}
  }
  if(accountLockHeartbeat){clearInterval(accountLockHeartbeat);accountLockHeartbeat=null}
}

    session=savedSession;document.body.classList.remove("staff-home-only");applyTheme();applyLanguage();
    let lockOk=false;
    try{const lock=await acquireAccountLock(session.id,'admin',null,session.name||'Admin');if(lock?.ok){session.lockToken=lock.token;sessionStorage.setItem(STORE.session,JSON.stringify(session));lockOk=true}}catch(e){}
    if(lockOk){adminDashboard();startAccountLockHeartbeat()}else{session=null;sessionStorage.removeItem(STORE.session);renderLogin()}
  }else if(savedSession && savedSession.id){
    const b=businessById(savedSession.businessId||"BUS-000001");
    if(IS_NATIVE_APP && b && !read("fb_business_data_"+b.id,null))try{await loadBundledBusinessSnapshot(b.id)}catch(e){}
    if(b && b.status==="active" && enforceLicenseAccess(b) && loadBusinessSnapshot(b.id)){
      const a=accountById(savedSession.id);
      if(a && enforceLicenseAccess(b)){
        session={id:a.id,username:a.username,name:a.name,role:a.role,businessId:b.id,lockToken:savedSession.lockToken};
        const secure=await verifyBusinessServerState(b);
        let lockOk=false;
        if(secure){try{const lock=await acquireAccountLock(a.id,'business',b.id,a.name);if(lock?.ok){session.lockToken=lock.token;sessionStorage.setItem(STORE.session,JSON.stringify(session));lockOk=true}}catch(e){}}
        if(lockOk){document.body.classList.toggle("staff-home-only",!isOwner());applyTheme();renderHome();startAccountLockHeartbeat();try{await syncBusinessActiveSession()}catch(e){}}
        else{session=null;sessionStorage.removeItem(STORE.session);renderLogin()}
      }else{session=null;sessionStorage.removeItem(STORE.session);renderLogin()}
    }else{session=null;sessionStorage.removeItem(STORE.session);renderLogin()}
  }else{
    session=null;sessionStorage.removeItem(STORE.session);document.body.classList.remove("staff-home-only");applyTheme();renderLogin();
  }
  if(session && !isAdmin())bootSharedDatabase().then(()=>{if(session&&!isAdmin()){const a=accountById(session.id);if(!a){logout();return}session={id:a.id,username:a.username,name:a.name,role:a.role,businessId:activeBusinessId};sessionStorage.setItem(STORE.session,JSON.stringify(session));render();}}).catch(e=>console.warn("Shared database boot failed:",e));
  runAutomaticDayClose();setInterval(()=>runAutomaticDayClose(),60000);
  setInterval(()=>{if(session&&!isAdmin()&&sharedDbReady)pullSharedData().then(()=>{if(!session||isAdmin())return;if(currentPage==="home")renderHome();else if(currentPage==="sales")renderSales();else if(currentPage==="stock")renderStock();})},10000);
  setInterval(()=>{if(session&&document.querySelector(".header-meta")){document.querySelector(".header-meta").innerHTML="<strong>"+now().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})+"</strong><small>"+now().toLocaleDateString("en-IN",{day:"2-digit",month:"short"})+"</small>"}},30000);
})();
</script>
</body>
</html>
